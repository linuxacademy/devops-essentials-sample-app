plugins {
    id 'base'
}

def siteDir = layout.projectDirectory.dir('src')
def requiredFiles = ['index.html', 'css/styles.css', 'js/main.js', 'favicon.svg']

tasks.register('verifySite') {
    group = 'verification'
    description = 'Checks that every file the site depends on is present.'
    inputs.dir(siteDir)
    doLast {
        def missing = requiredFiles.findAll { !siteDir.file(it).asFile.exists() }
        if (missing) {
            throw new GradleException("Missing site files: ${missing.join(', ')}")
        }
    }
}

tasks.register('siteZip', Zip) {
    group = 'build'
    description = 'Packages the static site as a deployable archive.'
    from siteDir
    archiveFileName = "${rootProject.name}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
}

check.dependsOn tasks.named('verifySite')
assemble.dependsOn tasks.named('siteZip')
